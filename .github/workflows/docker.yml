name: Build and publish container image

on:
  push:
    branches: [main]
    # 匹配 v1.0 / v1.0.0 / v2.1.3 等任意 v 开头的标签
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自己算标签，避免 metadata-action 的 semver 规则在 v1.0（两段式）上报错
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"
          TAGS=""
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          if [ "$REF_TYPE" = "tag" ]; then
            V="${REF_NAME#v}"                      # v1.0 -> 1.0
            TAGS="${IMG}:${REF_NAME},${IMG}:${V}"
            # 只有三段式才补主版本/次版本别名
            if echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              MAJOR="${V%%.*}"
              MINOR="$(echo "$V" | cut -d. -f1-2)"
              TAGS="${TAGS},${IMG}:${MINOR},${IMG}:${MAJOR}"
            fi
            TAGS="${TAGS},${IMG}:latest"
          elif [ "$REF_TYPE" = "branch" ]; then
            TAGS="${IMG}:$REF_NAME"
            [ "$REF_NAME" = "main" ] && TAGS="${TAGS},${IMG}:latest"
          fi

          if [ -z "$TAGS" ]; then
            echo "::error::无法计算镜像标签"
            exit 1
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "计算出的标签："
          echo "$TAGS" | tr ',' '\n' | sed 's/^/  /'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # DH2600 是 x86_64，只构建 amd64
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=DH2600 Fan Control
            org.opencontainers.image.description=UGREEN DH2600 NAS 风扇控制容器
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            PIP_TRUSTED_HOST=pypi.org
